<div class="modal-overlay" (click)="onClose()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>Edit Category</h3>
      <button class="close-btn" (click)="onClose()">×</button>
    </div>

    <form [formGroup]="editCategoryForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="categoryName">Category Name</label>
        <input id="categoryName" type="text" formControlName="categoryName" placeholder="Enter category name"
          [class.error]="categoryName?.invalid && categoryName?.touched">

        <div *ngIf="categoryName?.invalid && categoryName?.touched" class="error-message">
          <small *ngIf="categoryName?.errors?.['required']">Category name is required</small>
        </div>
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" formControlName="description" placeholder="Enter description (optional)"
          rows="3"></textarea>
      </div>

      <!-- Show changes summary -->
      <div *ngIf="hasChanges" class="changes-summary">
        <h4>Changes to be saved:</h4>
        <ul>
          <li *ngIf="categoryName?.value !== originalData?.categoryName">
            Category Name: "{{ originalData?.categoryName }}" → "{{ categoryName?.value }}"
          </li>
          <li *ngIf="(description?.value || '') !== (originalData?.description || '')">
            Description: "{{ originalData?.description || '(none)' }}" → "{{ description?.value || '(none)' }}"
          </li>
        </ul>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-secondary" (click)="onClose()">Cancel</button>
        <button type="submit" class="btn-success" [disabled]="editCategoryForm.invalid || !hasChanges"
          [title]="!hasChanges ? 'No changes to save' : editCategoryForm.invalid ? 'Please fill all required fields' : 'Save changes'">
          {{ hasChanges ? 'Save Changes' : 'No Changes' }}
        </button>
      </div>
    </form>
  </div>
</div>
