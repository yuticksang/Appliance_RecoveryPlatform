
<div class="modal-overlay" (click)="onClose()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>Edit Admin</h3>
      <button class="close-btn" (click)="onClose()">×</button>
    </div>

    <form>
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <div class="input-with-reset">
          <input id="fullName" type="text" placeholder="Enter full name (optional)">
        </div>

        <!-- <small class="help-text">Leave empty to keep current value</small> -->
      </div>

      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-with-reset">
          <input id="username" type="text" placeholder="Enter username (optional)">
        </div>
        <div class="error-message" style="display: none;">
          <small>Username must be at least 3 characters if provided</small>
        </div>
        <!-- <small class="help-text">Leave empty to keep current value. Must be at least 3 characters if changed.</small> -->
      </div>

      <div class="form-row">
        <div class="form-group half-width">
          <label for="password">Password</label>
          <input
            id="password"
            type="password"
            placeholder="Enter new password (min 8 chars)">

          <div class="error-message" style="display: none;">
            <small>Password must be at least 8 characters</small>
          </div>

          <!-- <small class="help-text">Leave empty to keep current password</small> -->
        </div>

        <div class="form-group half-width">
          <label for="confirmPassword">Confirm Password</label>
          <input
            id="confirmPassword"
            type="password"
            placeholder="Confirm new password">

          <div class="error-message" style="display: none;">
            <small>Passwords do not match</small>
          </div>
        </div>
      </div>

      <div class="changes-summary" style="display: none;">
        <h4>Changes to be saved:</h4>
        <ul>
          <li>Full Name: "Old Name" → "New Name"</li>
          <li>Username: "Old Username" → "New Username"</li>
          <li>Password: Will be updated (new password set)</li>
        </ul>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-secondary">Cancel</button>
        <button type="submit" class="btn-success" title="Save changes">Save Changes</button>
      </div>
    </form>
  </div>
</div>
