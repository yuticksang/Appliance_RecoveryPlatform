
<div class="modal-overlay" (click)="onClose()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>Edit Condition Score</h3>
      <button class="close-btn" (click)="onClose()">×</button>
    </div>

    <form (ngSubmit)="onSubmit()">

      <div class="form-row">
        <div class="form-group half-width">
          <label for="Criteria">Criteria</label>
          <input
            id="Criteria"
            type="text"
            [value]="criteriaName()"
            readonly
            class="readonly-input">
        </div>

        <div class="form-group half-width">
          <label for="category">Appliance Category</label>
          <input
            id="category"
            type="text"
            [value]="categoryName"
            readonly
            class="readonly-input">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group half-width">
          <label for="description">Description</label>
          <input
            id="description"
            type="text"
            [value]="description()"
            readonly
            class="readonly-input">
        </div>

        <div class="form-group half-width">
          <label for="scoreValue">Score Value <span class="required">*</span></label>
          <input
            id="score"
            type="text"
            [ngModel]="scoreValue()"
            (ngModelChange)="onScoreChange($event)"
            name="score"
            required
            placeholder="Enter score value"
            [class.invalid-input]="!isValidScore()">

         <div class="error-message" *ngIf="errorMessage()">
            <small>{{ errorMessage() }}</small>
          </div>
          <small class="help-text">Only numbers 0-100 are allowed.</small>
        </div>
      </div>



      <div class="changes-summary" *ngIf="hasChanges() && isValidScore()">
        <h4>Changes to be saved:</h4>
        <ul>
         <li>Score Value: {{ originalScoreValue() }} → {{ scoreValue() }}</li>
        </ul>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-secondary" (click)="onClose()">Cancel</button>
        <button type="submit" class="btn-success"  [disabled]="!hasChanges() || isSaving()" title="Save changes">Save Changes</button>
      </div>
    </form>
  </div>
</div>
