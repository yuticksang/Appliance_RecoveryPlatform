<header class="admin-header">
  <div class="admin-header-container">
    <img src="assets/image/EzRecover_Icon.png" alt="Ez Recover" class="header-logo" />
  </div>
</header>

<section class="auth-shell">
  <div class="auth-card">
    <h1 class="auth-title">Admin Login</h1>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="form-field">
        <label class="form-label">Username or Admin ID</label>
        <input class="form-input" type="text" formControlName="emailOrUsername"
               placeholder="Enter username or admin ID" />
        <div *ngIf="emailOrUsername?.invalid && emailOrUsername?.touched" class="error-message">
          Username or Admin ID is required
        </div>
      </div>

      <div class="form-field">
        <label class="form-label">Your password</label>
        <input class="form-input" [type]="hide ? 'password' : 'text'"
               formControlName="password" placeholder="Enter your password" />
      </div>

      <button class="btn-login" type="submit" [disabled]="form.invalid || loading">
        Log in
      </button>
    </form>
  </div>
</section>
