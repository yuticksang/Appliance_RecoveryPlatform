<section class="auth-shell">
  <h1 class="title">Reset Password</h1>

  <div *ngIf="success" class="success-message">
    <p>Password reset successful! You can now log in with your new password.</p>
    <p>Redirecting to login page...</p>
  </div>

  <form *ngIf="!success" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div formGroupName="passwordGroup">
      <div class="field password">
        <label>Enter New Password</label>
        <div class="input-wrap">
          <input type="password" formControlName="password" placeholder="At least 8 characters" />
        </div>
        <small class="error" *ngIf="password.touched && password.errors?.['required']">Password is required.</small>
        <small class="error" *ngIf="password.touched && password.errors?.['minLength']">Min 8 characters.</small>
      </div>

      <div class="field password">
        <label>Enter Again Your Password</label>
        <div class="input-wrap">
          <input type="password" formControlName="confirm" placeholder="Re-enter password" />
        </div>
        <small class="error" *ngIf="(g.touched && g.errors?.['mismatch'])">Passwords do not match.</small>
        <small class="error" *ngIf="confirm.touched && confirm.errors?.['required']">Please confirm your password.</small>
      </div>
    </div>

    <button class="btn-primary" type="submit" [disabled]="loading">
      {{ loading ? 'Resetting...' : 'Reset Password' }}
    </button>
  </form>
</section>
