<div class="verify-email-container">
  <div class="verify-email-card">
    <!-- Loading State -->
    <div *ngIf="verificationStatus === 'loading'" class="status-content loading">
      <div class="spinner"></div>
      <h1>Verifying Email</h1>
      <p>{{ message }}</p>
    </div>

    <!-- Success State -->
    <div *ngIf="verificationStatus === 'success'" class="status-content success">
      <div class="icon-circle success-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <h1>Email Verified!</h1>
      <p>{{ message }}</p>
      <p class="redirect-message">Redirecting to login page...</p>
      <button class="btn-primary" (click)="goToLogin()">Go to Login Now</button>
    </div>

    <!-- Error State -->
    <div *ngIf="verificationStatus === 'error'" class="status-content error">
      <div class="icon-circle error-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="15" y1="9" x2="9" y2="15"></line>
          <line x1="9" y1="9" x2="15" y2="15"></line>
        </svg>
      </div>
      <h1>Verification Failed</h1>
      <p>{{ message }}</p>
      <div class="error-actions">
        <button class="btn-secondary" (click)="goToLogin()">Back to Login</button>
        <a routerLink="/register" class="link">Register Again</a>
      </div>
    </div>
  </div>
</div>
