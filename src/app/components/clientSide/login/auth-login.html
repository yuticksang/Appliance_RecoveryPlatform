<section class="er-auth">
  <div class="er-auth__card">
    <h1>Log in Using Social Account</h1>

    <div class="er-auth__social">
      <button type="button" class="er-social er-social--fb">
        <i class="fa-brands fa-facebook-f"></i> Continue with Facebook
      </button>
      <button type="button" class="er-social er-social--gg">
        <i class="fa-brands fa-google"></i> Continue with Google
      </button>
    </div>

    <div class="er-auth__or"><span>OR</span></div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="er-form">
      <label>Email address</label>
      <input type="email" formControlName="email" placeholder="Enter your email address" />
      <small class="er-error" *ngIf="f.email.touched && f.email.invalid">
        <span *ngIf="f.email.errors?.['required']">Email is required.</span>
        <span *ngIf="f.email.errors?.['email']">Enter a valid email.</span>
      </small>

      <label>Your password</label>
      <div class="er-password">
        <input [type]="hide ? 'password' : 'text'" formControlName="password" placeholder="Enter your password" />
      </div>
      <small class="er-error" *ngIf="f.password.touched && f.password.invalid">
        <span *ngIf="f.password.errors?.['required']">Password is required.</span>
        <span *ngIf="f.password.errors?.['minlength']">Min 8 characters.</span>
      </small>

      <button class="er-primary" type="submit" [disabled]="form.invalid">Log in</button>

      <div class="er-actions">
        <a class="er-link" routerLink="/forgot-password">Forget your password</a>
      </div>

      <div class="er-divider"></div>

      <button class="er-outline" type="button" routerLink="/register">Sign up</button>

      <p class="er-note">Don’t have an account?</p>
    </form>
  </div>
</section>
