
<main class="page-bg py-5">
  <!-- Progress Bar -->
  <div class="progress-container">
    <div class="steps">
      <div *ngFor="let num of [1,2,3,4]" 
           [ngClass]="{'active': num === 2}" 
           class="step-circle">{{ num }}</div>
    </div>
  </div>

  <h2 class="page-title">Appliances Conditions</h2>
  <p class="page-p">What’s is your appliances conditions?</p>

  <div class="form-container">
    <!-- Q1 -->
    <div class="form-section">
      <label class="question">1. Is the appliance currently working?</label>
      <select  class="form-select">
        <option>Fully working</option>
        <option>Partially working</option>
        <option>Not working</option>
      </select>
    </div>

    <!-- Q2 -->
    <div class="form-section">
      <label class="question">2. Does the appliance show any of the following?</label>
      <div class="checkbox-list">
        <label *ngFor="let issue of issues" class="checkbox-item">
          <input type="checkbox" [checked]="selectedIssues.includes(issue)" 
                 (change)="toggleIssue(issue)" />
          {{ issue }}
        </label>
      </div>
    </div>

    <!-- Q3 -->
    <div class="form-section">
      <label class="question">3. What is the physical condition of the appliance?</label>
      <div class="physical-grid">
        <div *ngFor="let option of physicalOptions"
             (click)="physicalCondition = option.label"
             [ngClass]="{'selected': physicalCondition === option.label}"
             class="physical-card">
          <img [src]="option.img" [alt]="option.label" />
          <p>{{ option.label }}</p>
        </div>
      </div>
    </div>

    <!-- Q4 -->
    <div class="form-section">
      <label class="question">4. Upload Photos</label>
      <div class="upload-box">
        <p>Drag or drop files</p>
        <button class="upload-btn">Upload from computer</button>
      </div>
    </div>

    <!-- Q5 -->
    <div class="form-section">
      <label class="question">5. Additional Notes (Optional)</label>
      <textarea placeholder="Say something..." class="text-area"></textarea>
    </div>

    <!-- Buttons -->
    <div class="button-group">
      <button class="btn back-btn">Back</button>
      <button (click)="handleNext()" class="btn next-btn">Next</button>
    </div>
  </div>
</main>
