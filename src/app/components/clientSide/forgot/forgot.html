<section class="auth-shell">
  <h1 class="title">Reset Password</h1>

  <div *ngIf="submitted" class="success-message">
    <p>Password reset link sent! Please check your email inbox to reset your password.</p>
    <button routerLink="/login" class="btn-primary">Back to Login</button>
  </div>

  <form *ngIf="!submitted" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label class="field">
      <span>Enter Your Email address</span>
      <input type="email" formControlName="email" placeholder="you@example.com" />
      <small class="error" *ngIf="f.email.touched && f.email.errors?.['required']">Email is required.</small>
      <small class="error" *ngIf="f.email.touched && f.email.errors?.['email']">Enter a valid email.</small>
    </label>

    <button class="btn-primary" type="submit" [disabled]="loading">
      {{ loading ? 'Sending...' : 'Reset' }}
    </button>
  </form>
</section>
