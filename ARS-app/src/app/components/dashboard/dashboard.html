 <div class="title">
            <h1>Overview</h1>     
</div>

<div class="stats-grid">
            <div class="stat-card bg-blue">
                <div class="stat-label">Total Appliances Recovered</div>
                <div class="stat-value">2,318</div>
                <div class="stat-change">+6.08% <i class="bi bi-arrow-up-right"></i></div>
            </div>
            <div class="stat-card bg-pink">
                <div class="stat-label">Total Payouts</div>
                <div class="stat-value">77,265</div>
                <div class="stat-change">+11.01% <i class="bi bi-arrow-up-right"></i></div>
            </div>
            <div class="stat-card bg-green">
                <div class="stat-label">Active Recovery Transactions</div>
                <div class="stat-value">156</div>
                <div class="stat-change">+15.03% <i class="bi bi-arrow-up-right"></i></div>
            </div>
            <div class="stat-card bg-purple">
                <div class="stat-label">Total Appliances Covered</div>
                <div class="stat-value">61</div>
            </div>
</div>

    <div class="chart-card">
            <div class="chart-header">
                <div class="chart-tabs">
                    <button class="chart-tab"
                    [class.active]="activeTab === 'appliance'"
                    (click)="switchTab('appliance')">
                    Appliance Recovered</button>
                    <button class="chart-tab"
                    [class.active]="activeTab === 'users'"
                    (click)="switchTab('users')">
                    Active Users</button>
                </div>
                <div class="chart-controls">
                    <div class="custom-dropdown">
                        <button class="dropdown-trigger">
                            2025 <i class="bi bi-chevron-down"></i>
                        </button>
                        <div class="dropdown-content">
                            <a href="#">2025</a>
                            <a href="#">2024</a>
                            <a href="#">2023</a>
                            <a href="#">2022</a>
                        </div>
                    </div>
                    <button class="btn"><i class="bi bi-three-dots"></i></button>
                </div>
            </div>
            <div class="chart-placeholder">
                <svg width="100%" height="300">

                     <!-- Y-axis line -->
                    <line x1="50" y1="40" x2="50" y2="260" stroke="#e0e0e0" stroke-width="1"/>
                    
                    <!-- Y-axis labels and grid lines -->
                    <text x="40" y="45" text-anchor="end" font-size="12" fill="#999">120</text>
                    <line x1="50" y1="40" x2="750" y2="40" stroke="#f5f5f5" stroke-width="1"/>
                    
                    <text x="40" y="85" text-anchor="end" font-size="12" fill="#999">100</text>
                    <line x1="50" y1="80" x2="750" y2="80" stroke="#f5f5f5" stroke-width="1"/>
                    
                    <text x="40" y="125" text-anchor="end" font-size="12" fill="#999">80</text>
                    <line x1="50" y1="120" x2="750" y2="120" stroke="#f5f5f5" stroke-width="1"/>
                    
                    <text x="40" y="165" text-anchor="end" font-size="12" fill="#999">60</text>
                    <line x1="50" y1="160" x2="750" y2="160" stroke="#f5f5f5" stroke-width="1"/>
                    
                    <text x="40" y="205" text-anchor="end" font-size="12" fill="#999">40</text>
                    <line x1="50" y1="200" x2="750" y2="200" stroke="#f5f5f5" stroke-width="1"/>
                    
                    <text x="40" y="245" text-anchor="end" font-size="12" fill="#999">20</text>
                    <line x1="50" y1="240" x2="750" y2="240" stroke="#f5f5f5" stroke-width="1"/>
                    
                   

                    <polyline [attr.points]="polylinePoints"
                      fill="none" stroke="#E8B3E8" stroke-width="2"/>
                    
                    <!-- Data points (adjusted x positions) -->
                    @for (point of currentChart.points; track $index) {
                    <circle
                        [attr.cx]="point.x"
                        [attr.cy]="point.y"
                        r="4"
                        [attr.fill]="$index % 2 === 0 ? '#333' : '#fff'"
                        [attr.stroke]="$index % 2 === 0 ? '#none' : '#333'"
                        [attr.stroke-width]="$index % 2 === 0 ? '0' : '2'"/>
                    }

                    <!-- X-axis labels (adjusted x positions) -->
                    @for (month of months; track $index) {
                        @if ($index < 13){
                            <text
                                [attr.x]="80 + ($index* 70)"
                                y="285"
                                text-anchor="middle"
                                font-size="12"
                                fill="#999">{{ month }}
                            </text>
                        }
                    }
                </svg>
            </div>
        </div>
